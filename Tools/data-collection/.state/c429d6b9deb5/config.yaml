# Deployment identity and GPU memory reserve.
# deploy.sh rewrites uid and gpu_uuid for the chosen user and GPU.
reserve_mib: 1024
startup_seconds: 30
# Quiet period before re-reserving; a change of 1 GiB or less keeps it stable.
stable_seconds: 60
# Exit cleanly after this much uptime so the container rebuilds its CUDA context.
restart_seconds: 43200
# idle_duty applies unless the target UID itself holds a GPU process.
# shared_duty applies while that user does; other users never lower the duty.
idle_duty: 0.65
shared_duty: 0.03
uid: 1021
gpu_uuid: GPU-6c9d27a4-0c3d-61b3-5e6f-0fd432bbad25
